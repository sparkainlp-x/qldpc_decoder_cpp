name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libomp-dev

      - name: Configure
        run: >-
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run smoke test
        run: ./build/qldpc_decoder

      - name: Run Catch2 unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Run latency benchmark
        env:
          LDPC_MAX_LATENCY_NS: 1000
        run: ./build/ldpc_benchmark
