name: QLDPC Software and FPGA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libomp-dev

      - name: Configure
        run: >-
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run smoke test
        run: ./build/qldpc_decoder

      - name: Run Catch2 unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Run latency benchmark
        env:
          LDPC_MAX_LATENCY_NS: 1000
        run: ./build/ldpc_benchmark

      - name: Run Monte-Carlo FER simulation
        shell: bash
        run: |
          set -euo pipefail
          trials="${MONTE_CARLO_TRIALS:-10000}"
          ./build/monte_carlo_sim --trials "${trials}" --csv fer_curve.csv

      - name: Upload Monte-Carlo FER curve
        uses: actions/upload-artifact@v4
        with:
          name: qldpc-fer-curve
          if-no-files-found: error
          retention-days: 30
          path: fer_curve.csv

  hardware-bitstream-build:
    # Ne jamais exécuter du code d'une pull request externe sur un runner local.
    if: github.event_name != 'pull_request'
    needs: software-ci
    runs-on: [self-hosted, vivado, zcu111]
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build HLS, Vivado and PetaLinux artifacts
        shell: bash
        run: |
          set -euo pipefail
          source /tools/Xilinx/Vitis/2023.2/settings64.sh
          source /tools/Xilinx/Vitis_HLS/2023.2/settings64.sh
          source /tools/xilinx/petalinux/2023.2/settings.sh
          make all

      - name: Build HIL benchmark
        run: |
          cmake -S . -B build-hil -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_UNIT_TESTS=OFF \
            -DBUILD_AXI_DMA_DRIVER=OFF \
            -DBUILD_HIL_BENCHMARK=ON
          cmake --build build-hil --parallel 2

      - name: Run HIL latency gate
        env:
          HIL_NUM_TESTS: 100000
          HIL_MAX_LATENCY_US: 100
        run: ./build-hil/hil_benchmark

      - name: Upload HIL latency report
        uses: actions/upload-artifact@v4
        with:
          name: qldpc-hil-latency-report
          if-no-files-found: error
          retention-days: 30
          path: latencies_report.csv

      - name: Upload FPGA and PetaLinux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qldpc-rfsoc-bitstream-artifacts
          if-no-files-found: error
          retention-days: 30
          path: |
            vivado/*.xsa
            petalinux/images/linux/BOOT.BIN
            petalinux/images/linux/image.ub
            petalinux/images/linux/download.bit
